<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Cute Christmas Snake 🎅</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFA5D8 25%, #E6E6FA 50%, #B4E4FF 75%, #D4F1F4 100%);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Cute floating decorations */
        .decoration {
            position: fixed;
            font-size: 2em;
            animation: float 3s ease-in-out infinite;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Snowflakes */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1em;
            animation: fall linear infinite;
            z-index: 1;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            color: gold;
            font-size: 0.8em;
            animation: sparkle 2s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .game-container {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFE4E1 100%);
            border-radius: 40px;
            padding: 35px;
            box-shadow:
                0 25px 70px rgba(255, 105, 180, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.8);
            text-align: center;
            border: 6px solid transparent;
            background-image:
                linear-gradient(#FFF9E6, #FFE4E1),
                linear-gradient(135deg, #FF69B4, #FFD700, #87CEEB);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            z-index: 10;
            position: relative;
            animation: containerPulse 3s ease-in-out infinite;
        }

        @keyframes containerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        h1 {
            background: linear-gradient(45deg, #FF69B4, #FFD700, #87CEEB, #98FB98);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            font-size: 2.8em;
            font-weight: 700;
            animation: titleBounce 2s ease-in-out infinite;
            text-shadow: 3px 3px 6px rgba(255, 105, 180, 0.3);
            letter-spacing: 2px;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            gap: 20px;
        }

        .score-item {
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white;
            padding: 18px 35px;
            border-radius: 30px;
            font-size: 1.3em;
            font-weight: 600;
            box-shadow:
                0 8px 20px rgba(255, 105, 180, 0.5),
                inset 0 -2px 10px rgba(255, 255, 255, 0.3);
            border: 3px solid #FFE4E1;
            animation: scorePulse 1.5s ease-in-out infinite;
            transition: transform 0.3s;
        }

        .score-item:hover {
            transform: scale(1.1) rotate(3deg);
        }

        @keyframes scorePulse {
            0%, 100% { box-shadow: 0 8px 20px rgba(255, 105, 180, 0.5); }
            50% { box-shadow: 0 8px 30px rgba(255, 215, 0, 0.7); }
        }

        #gameCanvas {
            border: 6px solid transparent;
            background-image:
                linear-gradient(white, white),
                linear-gradient(135deg, #FFB6C1, #87CEEB, #FFD700);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 30px;
            display: block;
            margin: 0 auto 25px;
            box-shadow:
                0 15px 40px rgba(135, 206, 235, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .controls {
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            color: white;
            border: 4px solid #FFB6C1;
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 25px rgba(135, 206, 235, 0.5),
                inset 0 -3px 10px rgba(255, 255, 255, 0.5);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            animation: buttonWiggle 3s ease-in-out infinite;
        }

        @keyframes buttonWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg) scale(1.05); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        button:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow:
                0 15px 35px rgba(255, 215, 0, 0.7),
                inset 0 -3px 10px rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        button:active {
            transform: scale(0.95);
        }

        .instructions {
            color: #FF69B4;
            margin-top: 25px;
            line-height: 1.8;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 228, 225, 0.9));
            padding: 20px;
            border-radius: 25px;
            border: 4px dashed #FFB6C1;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
        }

        .instructions p {
            margin: 8px 0;
        }

        .instructions strong {
            color: #FF1493;
            font-size: 1.2em;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: linear-gradient(135deg, #FFF9E6 0%, #FFE4E1 100%);
            padding: 50px;
            border-radius: 40px;
            box-shadow:
                0 30px 80px rgba(255, 105, 180, 0.6),
                inset 0 0 40px rgba(255, 255, 255, 0.8);
            z-index: 1000;
            text-align: center;
            border: 6px solid #FF69B4;
            animation: gameOverPop 0.5s ease-out forwards;
        }

        @keyframes gameOverPop {
            0% { transform: translate(-50%, -50%) scale(0); rotate: 0deg; }
            50% { transform: translate(-50%, -50%) scale(1.1); rotate: 10deg; }
            100% { transform: translate(-50%, -50%) scale(1); rotate: 0deg; }
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            background: linear-gradient(45deg, #FF69B4, #FFD700, #87CEEB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            margin-bottom: 25px;
            animation: titleBounce 1s ease-in-out infinite;
        }

        .game-over p {
            font-size: 1.5em;
            margin: 15px 0;
            color: #FF69B4;
            font-weight: 600;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.4), rgba(135, 206, 235, 0.6));
            backdrop-filter: blur(5px);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        /* Cute corner decorations */
        .corner-decor {
            position: fixed;
            font-size: 3em;
            z-index: 5;
            animation: cornerFloat 4s ease-in-out infinite;
        }

        @keyframes cornerFloat {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.1); }
        }

        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; }
    </style>
</head>
<body>
    <!-- Corner decorations -->
    <div class="corner-decor top-left">🎀</div>
    <div class="corner-decor top-right">🌟</div>
    <div class="corner-decor bottom-left">🍭</div>
    <div class="corner-decor bottom-right">🎁</div>

    <!-- Generate snowflakes -->
    <script>
        for (let i = 0; i < 30; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
            document.body.appendChild(snowflake);
        }

        // Generate sparkles
        for (let i = 0; i < 15; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerHTML = '✨';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(sparkle);
        }

        // Generate floating decorations
        const decorations = ['🎄', '🎅', '🦌', '⛄', '🔔', '🌟'];
        for (let i = 0; i < 10; i++) {
            const decor = document.createElement('div');
            decor.className = 'decoration';
            decor.innerHTML = decorations[Math.floor(Math.random() * decorations.length)];
            decor.style.left = Math.random() * 100 + '%';
            decor.style.top = Math.random() * 100 + '%';
            decor.style.animationDelay = Math.random() * 3 + 's';
            decor.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(decor);
        }
    </script>

    <div class="game-container">
        <h1>✨ Cute Christmas Snake ✨</h1>

        <div class="score-board">
            <div class="score-item">
                🎁 Gifts: <span id="score">0</span>
            </div>
            <div class="score-item">
                ⭐ Best: <span id="highScore">0</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn">🎮 Start Game!</button>
        </div>

        <div class="instructions">
            <p><strong>✨ How to Play ✨</strong></p>
            <p>🎯 Use Arrow Keys to guide your cute snake!</p>
            <p>🎁 Collect presents to grow longer!</p>
            <p>💫 Don't bump into walls or yourself!</p>
            <p><em>Have a magical time! 🎄💖</em></p>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOver">
        <h2>🎄 Aww, Game Over! 🎄</h2>
        <p>🎁 Gifts Collected: <span id="finalScore">0</span></p>
        <p>⭐ Your Best: <span id="finalHighScore">0</span></p>
        <button id="restartBtn">💫 Play Again!</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const gameOverDiv = document.getElementById('gameOver');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreElement = document.getElementById('finalScore');
        const finalHighScoreElement = document.getElementById('finalHighScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 15, y: 15};
        let score = 0;
        let highScore = localStorage.getItem('cuteChristmasSnakeHighScore') || 0;
        let gameLoop = null;
        let gameRunning = false;
        let gameSpeed = 100;
        let snowflakes = [];
        let stars = [];
        let animationFrame = 0;

        // Initialize background snowflakes
        for (let i = 0; i < 40; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 1 + 0.3,
                size: Math.random() * 3 + 1,
                sway: Math.random() * 2 - 1
            });
        }

        // Initialize stars
        for (let i = 0; i < 20; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        highScoreElement.textContent = highScore;

        function drawGame() {
            animationFrame++;

            // Clear canvas with cute gradient background
            const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGradient.addColorStop(0, '#E6F3FF');
            bgGradient.addColorStop(0.5, '#FFE4F0');
            bgGradient.addColorStop(1, '#F0E6FF');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw twinkling stars
            stars.forEach(star => {
                const twinkle = Math.sin(animationFrame * 0.05 + star.twinkle);
                ctx.fillStyle = `rgba(255, 215, 0, ${0.3 + twinkle * 0.3})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw and update cute snowflakes
            snowflakes.forEach(flake => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(135, 206, 235, 0.5)';
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();

                flake.y += flake.speed;
                flake.x += Math.sin(flake.y * 0.01) * flake.sway;
                if (flake.y > canvas.height) {
                    flake.y = 0;
                    flake.x = Math.random() * canvas.width;
                }
            });
            ctx.shadowBlur = 0;

            // Move snake
            if (velocity.x !== 0 || velocity.y !== 0) {
                const head = {
                    x: snake[0].x + velocity.x,
                    y: snake[0].y + velocity.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    endGame();
                    return;
                }

                // Check self collision
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        endGame();
                        return;
                    }
                }

                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreElement.textContent = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = highScore;
                        localStorage.setItem('cuteChristmasSnakeHighScore', highScore);
                    }

                    placeFood();

                    // Increase speed slightly
                    if (score % 5 === 0 && gameSpeed > 50) {
                        gameSpeed -= 5;
                        clearInterval(gameLoop);
                        gameLoop = setInterval(drawGame, gameSpeed);
                    }
                } else {
                    snake.pop();
                }
            }

            // Draw cute snake with kawaii colors
            const cuteColors = [
                '#FFB6C1', // Pink
                '#87CEEB', // Sky blue
                '#FFD700', // Gold
                '#98FB98', // Pale green
                '#DDA0DD', // Plum
                '#F0E68C'  // Khaki
            ];

            snake.forEach((segment, index) => {
                const color = cuteColors[index % cuteColors.length];
                const pulse = Math.sin(animationFrame * 0.1 + index * 0.5) * 2;

                // Glow effect
                ctx.shadowBlur = 20 + pulse;
                ctx.shadowColor = color;

                // Create cute gradient for segment
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    2,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2 + 2
                );
                gradient.addColorStop(0, 'white');
                gradient.addColorStop(0.4, color);
                gradient.addColorStop(1, color);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2 - 1,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // Add cute sparkle on head
                if (index === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(
                        segment.x * gridSize + gridSize / 2 - 3,
                        segment.y * gridSize + gridSize / 2 - 3,
                        2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            });

            ctx.shadowBlur = 0;

            // Draw super cute present
            const presentX = food.x * gridSize;
            const presentY = food.y * gridSize;
            const bounce = Math.sin(animationFrame * 0.1) * 3;

            // Present shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.beginPath();
            ctx.ellipse(
                presentX + gridSize / 2,
                presentY + gridSize + 2,
                gridSize / 2,
                gridSize / 6,
                0, 0, Math.PI * 2
            );
            ctx.fill();

            // Gift box with bounce
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#FFD700';

            const boxGradient = ctx.createLinearGradient(
                presentX, presentY + bounce,
                presentX + gridSize, presentY + gridSize + bounce
            );
            boxGradient.addColorStop(0, '#FF69B4');
            boxGradient.addColorStop(1, '#FF1493');
            ctx.fillStyle = boxGradient;

            ctx.beginPath();
            ctx.roundRect(presentX + 2, presentY + 2 + bounce, gridSize - 4, gridSize - 4, 4);
            ctx.fill();

            // Ribbon
            ctx.shadowBlur = 5;
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(presentX + 2, presentY + gridSize / 2 - 1 + bounce, gridSize - 4, 3);
            ctx.fillRect(presentX + gridSize / 2 - 1, presentY + 2 + bounce, 3, gridSize - 4);

            // Bow
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(presentX + gridSize / 2, presentY + gridSize / 2 + bounce, 4, 0, Math.PI * 2);
            ctx.fill();

            // Sparkles around present
            for (let i = 0; i < 4; i++) {
                const angle = (animationFrame * 0.1 + i * Math.PI / 2);
                const sparkleX = presentX + gridSize / 2 + Math.cos(angle) * (gridSize / 2 + 5);
                const sparkleY = presentY + gridSize / 2 + Math.sin(angle) * (gridSize / 2 + 5) + bounce;

                ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.beginPath();
                ctx.arc(sparkleX, sparkleY, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
        }

        function placeFood() {
            let newFood;
            let validPosition = false;

            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }
            }

            food = newFood;
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            velocity = {x: 1, y: 0};
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = score;
            placeFood();
            gameRunning = true;
            startBtn.innerHTML = '🔄 Restart Game!';

            if (gameLoop) {
                clearInterval(gameLoop);
            }
            gameLoop = setInterval(drawGame, gameSpeed);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            finalHighScoreElement.textContent = highScore;
            overlay.classList.add('show');
            gameOverDiv.classList.add('show');
        }

        function closeGameOver() {
            overlay.classList.remove('show');
            gameOverDiv.classList.remove('show');
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);

        restartBtn.addEventListener('click', () => {
            closeGameOver();
            startGame();
        });

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowUp':
                    if (velocity.y === 0) {
                        velocity = {x: 0, y: -1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) {
                        velocity = {x: 0, y: 1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) {
                        velocity = {x: -1, y: 0};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) {
                        velocity = {x: 1, y: 0};
                    }
                    e.preventDefault();
                    break;
            }
        });

        // Initial draw
        drawGame();
    </script>
</body>
</html>
