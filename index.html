<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #165B33 0%, #BB2528 50%, #146B3A 100%);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Snowflakes */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1em;
            animation: fall linear infinite;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 3px solid #FFD700;
            z-index: 10;
            position: relative;
        }

        h1 {
            background: linear-gradient(45deg, #BB2528, #146B3A, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }

        .score-item {
            background: linear-gradient(135deg, #BB2528 0%, #146B3A 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(187, 37, 40, 0.4);
            border: 2px solid #FFD700;
        }

        #gameCanvas {
            border: 4px solid #FFD700;
            border-radius: 10px;
            background-color: #0a1929;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 50px rgba(255, 215, 0, 0.1);
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #BB2528 0%, #146B3A 100%);
            color: white;
            border: 2px solid #FFD700;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(187, 37, 40, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            color: #333;
            margin-top: 20px;
            line-height: 1.6;
            background: rgba(255, 215, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #FFD700;
        }

        .instructions p {
            margin: 5px 0;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            text-align: center;
            border: 3px solid #FFD700;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            background: linear-gradient(45deg, #BB2528, #146B3A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 1.3em;
            margin: 10px 0;
            color: #333;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Generate snowflakes -->
    <script>
        for (let i = 0; i < 50; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.innerHTML = '❄';
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
            document.body.appendChild(snowflake);
        }
    </script>

    <div class="game-container">
        <h1>🎄 Christmas Lights Snake 🎅</h1>

        <div class="score-board">
            <div class="score-item">
                Gifts: <span id="score">0</span> 🎁
            </div>
            <div class="score-item">
                Best: <span id="highScore">0</span> ⭐
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn">🎮 Start Game</button>
        </div>

        <div class="instructions">
            <p><strong>🎄 How to Play:</strong></p>
            <p>Use Arrow Keys to guide your Christmas lights</p>
            <p>Collect presents to make your light string longer!</p>
            <p>Don't crash into walls or yourself!</p>
            <p><em>Happy Holidays! 🎅🎄</em></p>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOver">
        <h2>🎄 Game Over! 🎄</h2>
        <p>Gifts Collected: <span id="finalScore">0</span> 🎁</p>
        <p>Best Score: <span id="finalHighScore">0</span> ⭐</p>
        <button id="restartBtn">🎮 Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const gameOverDiv = document.getElementById('gameOver');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreElement = document.getElementById('finalScore');
        const finalHighScoreElement = document.getElementById('finalHighScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 15, y: 15};
        let score = 0;
        let highScore = localStorage.getItem('christmasSnakeHighScore') || 0;
        let gameLoop = null;
        let gameRunning = false;
        let gameSpeed = 100;
        let snowflakes = [];

        // Initialize background snowflakes
        for (let i = 0; i < 30; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 1 + 0.5,
                size: Math.random() * 3 + 1
            });
        }

        highScoreElement.textContent = highScore;

        function drawGame() {
            // Clear canvas with night sky gradient
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#0a1929');
            bgGradient.addColorStop(1, '#1e3a5f');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw and update snowflakes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            snowflakes.forEach(flake => {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.size, 0, Math.PI * 2);
                ctx.fill();

                flake.y += flake.speed;
                if (flake.y > canvas.height) {
                    flake.y = 0;
                    flake.x = Math.random() * canvas.width;
                }
            });

            // Draw subtle grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Move snake
            if (velocity.x !== 0 || velocity.y !== 0) {
                const head = {
                    x: snake[0].x + velocity.x,
                    y: snake[0].y + velocity.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    endGame();
                    return;
                }

                // Check self collision
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        endGame();
                        return;
                    }
                }

                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreElement.textContent = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = highScore;
                        localStorage.setItem('christmasSnakeHighScore', highScore);
                    }

                    placeFood();

                    // Increase speed slightly
                    if (score % 5 === 0 && gameSpeed > 50) {
                        gameSpeed -= 5;
                        clearInterval(gameLoop);
                        gameLoop = setInterval(drawGame, gameSpeed);
                    }
                } else {
                    snake.pop();
                }
            }

            // Draw Christmas lights snake with alternating colors
            const lightColors = ['#BB2528', '#146B3A', '#FFD700', '#FF6B6B', '#4ECDC4'];

            snake.forEach((segment, index) => {
                // Draw light bulb
                const color = lightColors[index % lightColors.length];

                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;

                // Create radial gradient for bulb
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    2,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2
                );
                gradient.addColorStop(0, 'white');
                gradient.addColorStop(0.3, color);
                gradient.addColorStop(1, color);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // Draw wire connector (small line to next segment)
                if (index < snake.length - 1) {
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(
                        segment.x * gridSize + gridSize / 2,
                        segment.y * gridSize + gridSize / 2
                    );
                    ctx.lineTo(
                        snake[index + 1].x * gridSize + gridSize / 2,
                        snake[index + 1].y * gridSize + gridSize / 2
                    );
                    ctx.stroke();
                }
            });

            ctx.shadowBlur = 0;

            // Draw Christmas present (food)
            const presentX = food.x * gridSize + 2;
            const presentY = food.y * gridSize + 2;
            const presentSize = gridSize - 4;

            // Gift box
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#FFD700';

            const giftGradient = ctx.createLinearGradient(
                presentX, presentY,
                presentX + presentSize, presentY + presentSize
            );
            giftGradient.addColorStop(0, '#BB2528');
            giftGradient.addColorStop(1, '#8B1A1D');
            ctx.fillStyle = giftGradient;
            ctx.fillRect(presentX, presentY, presentSize, presentSize);

            // Ribbon horizontal
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(presentX, presentY + presentSize / 2 - 1, presentSize, 2);

            // Ribbon vertical
            ctx.fillRect(presentX + presentSize / 2 - 1, presentY, 2, presentSize);

            // Bow
            ctx.beginPath();
            ctx.arc(presentX + presentSize / 2, presentY + presentSize / 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function placeFood() {
            let newFood;
            let validPosition = false;

            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }
            }

            food = newFood;
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            velocity = {x: 1, y: 0};
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = score;
            placeFood();
            gameRunning = true;
            startBtn.innerHTML = '🎮 Restart Game';

            if (gameLoop) {
                clearInterval(gameLoop);
            }
            gameLoop = setInterval(drawGame, gameSpeed);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            finalHighScoreElement.textContent = highScore;
            overlay.classList.add('show');
            gameOverDiv.classList.add('show');
        }

        function closeGameOver() {
            overlay.classList.remove('show');
            gameOverDiv.classList.remove('show');
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);

        restartBtn.addEventListener('click', () => {
            closeGameOver();
            startGame();
        });

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowUp':
                    if (velocity.y === 0) {
                        velocity = {x: 0, y: -1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) {
                        velocity = {x: 0, y: 1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) {
                        velocity = {x: -1, y: 0};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) {
                        velocity = {x: 1, y: 0};
                    }
                    e.preventDefault();
                    break;
            }
        });

        // Initial draw
        drawGame();
    </script>
</body>
</html>
