<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏖️ Summer Beach Snake ☀️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #87CEEB 0%, #FFE5B4 30%, #F0E68C 60%, #20B2AA 100%);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Cute floating decorations */
        .decoration {
            position: fixed;
            font-size: 2em;
            animation: float 3s ease-in-out infinite;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Bubbles instead of snowflakes */
        .bubble {
            position: fixed;
            bottom: -10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1em;
            animation: rise linear infinite;
            z-index: 1;
            opacity: 0.7;
        }

        @keyframes rise {
            to {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            color: #FFD700;
            font-size: 0.8em;
            animation: sparkle 2s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .game-container {
            background: linear-gradient(135deg, #FFF8DC 0%, #FFFACD 100%);
            border-radius: 40px;
            padding: 35px;
            box-shadow:
                0 25px 70px rgba(255, 165, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.8);
            text-align: center;
            border: 6px solid transparent;
            background-image:
                linear-gradient(#FFF8DC, #FFFACD),
                linear-gradient(135deg, #FF6347, #FFD700, #20B2AA);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            z-index: 10;
            position: relative;
            animation: containerPulse 3s ease-in-out infinite;
        }

        @keyframes containerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        h1 {
            background: linear-gradient(45deg, #FF6347, #FFD700, #20B2AA, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            font-size: 2.8em;
            font-weight: 700;
            animation: titleBounce 2s ease-in-out infinite;
            text-shadow: 3px 3px 6px rgba(255, 140, 0, 0.3);
            letter-spacing: 2px;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            gap: 20px;
        }

        .score-item {
            background: linear-gradient(135deg, #FF6347 0%, #FF4500 100%);
            color: white;
            padding: 18px 35px;
            border-radius: 30px;
            font-size: 1.3em;
            font-weight: 600;
            box-shadow:
                0 8px 20px rgba(255, 99, 71, 0.5),
                inset 0 -2px 10px rgba(255, 255, 255, 0.3);
            border: 3px solid #FFFACD;
            animation: scorePulse 1.5s ease-in-out infinite;
            transition: transform 0.3s;
        }

        .score-item:hover {
            transform: scale(1.1) rotate(3deg);
        }

        @keyframes scorePulse {
            0%, 100% { box-shadow: 0 8px 20px rgba(255, 99, 71, 0.5); }
            50% { box-shadow: 0 8px 30px rgba(255, 215, 0, 0.7); }
        }

        #gameCanvas {
            border: 6px solid transparent;
            background-image:
                linear-gradient(white, white),
                linear-gradient(135deg, #FF6347, #20B2AA, #FFD700);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 30px;
            display: block;
            margin: 0 auto 25px;
            box-shadow:
                0 15px 40px rgba(32, 178, 170, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .controls {
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #20B2AA 0%, #48D1CC 100%);
            color: white;
            border: 4px solid #FFD700;
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 25px rgba(32, 178, 170, 0.5),
                inset 0 -3px 10px rgba(255, 255, 255, 0.5);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            animation: buttonWiggle 3s ease-in-out infinite;
        }

        @keyframes buttonWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg) scale(1.05); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        button:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow:
                0 15px 35px rgba(255, 215, 0, 0.7),
                inset 0 -3px 10px rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        button:active {
            transform: scale(0.95);
        }

        .instructions {
            color: #FF6347;
            margin-top: 25px;
            line-height: 1.8;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 250, 205, 0.9));
            padding: 20px;
            border-radius: 25px;
            border: 4px dashed #20B2AA;
            box-shadow: 0 5px 15px rgba(32, 178, 170, 0.3);
        }

        .instructions p {
            margin: 8px 0;
        }

        .instructions strong {
            color: #FF4500;
            font-size: 1.2em;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: linear-gradient(135deg, #FFF8DC 0%, #FFFACD 100%);
            padding: 50px;
            border-radius: 40px;
            box-shadow:
                0 30px 80px rgba(255, 140, 0, 0.6),
                inset 0 0 40px rgba(255, 255, 255, 0.8);
            z-index: 1000;
            text-align: center;
            border: 6px solid #FF6347;
            animation: gameOverPop 0.5s ease-out forwards;
        }

        @keyframes gameOverPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); }
            50% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            background: linear-gradient(45deg, #FF6347, #FFD700, #20B2AA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            margin-bottom: 25px;
            animation: titleBounce 1s ease-in-out infinite;
        }

        .game-over p {
            font-size: 1.5em;
            margin: 15px 0;
            color: #FF6347;
            font-weight: 600;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 228, 181, 0.4), rgba(135, 206, 235, 0.6));
            backdrop-filter: blur(5px);
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        /* Cute corner decorations */
        .corner-decor {
            position: fixed;
            font-size: 3em;
            z-index: 5;
            animation: cornerFloat 4s ease-in-out infinite;
        }

        @keyframes cornerFloat {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.1); }
        }

        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; }
        .bottom-left { bottom: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; }
    </style>
</head>
<body>
    <!-- Corner decorations -->
    <div class="corner-decor top-left">🌴</div>
    <div class="corner-decor top-right">☀️</div>
    <div class="corner-decor bottom-left">🏄</div>
    <div class="corner-decor bottom-right">🍉</div>

    <!-- Generate bubbles -->
    <script>
        for (let i = 0; i < 30; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '○';
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = (Math.random() * 4 + 3) + 's';
            bubble.style.animationDelay = Math.random() * 5 + 's';
            bubble.style.fontSize = (Math.random() * 15 + 10) + 'px';
            document.body.appendChild(bubble);
        }

        // Generate sparkles
        for (let i = 0; i < 15; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerHTML = '✨';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(sparkle);
        }

        // Generate floating decorations
        const decorations = ['🌊', '🏖️', '🌺', '🐚', '⛱️', '🦀'];
        for (let i = 0; i < 10; i++) {
            const decor = document.createElement('div');
            decor.className = 'decoration';
            decor.innerHTML = decorations[Math.floor(Math.random() * decorations.length)];
            decor.style.left = Math.random() * 100 + '%';
            decor.style.top = Math.random() * 100 + '%';
            decor.style.animationDelay = Math.random() * 3 + 's';
            decor.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(decor);
        }
    </script>

    <div class="game-container">
        <h1>🌊 Summer Beach Snake ☀️</h1>

        <div class="score-board">
            <div class="score-item">
                🍉 Snacks: <span id="score">0</span>
            </div>
            <div class="score-item">
                ⭐ Best: <span id="highScore">0</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn">🏄 Start Game!</button>
        </div>

        <div class="instructions">
            <p><strong>🏖️ How to Play 🏖️</strong></p>
            <p>🎯 Use Arrow Keys to guide your beach snake!</p>
            <p>🍉 Collect summer snacks to grow longer!</p>
            <p>🌊 Don't crash into walls or yourself!</p>
            <p><em>Enjoy the sunny vibes! ☀️🌴</em></p>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOver">
        <h2>🌊 Game Over! ☀️</h2>
        <p>🍉 Snacks Collected: <span id="finalScore">0</span></p>
        <p>⭐ Your Best: <span id="finalHighScore">0</span></p>
        <button id="restartBtn">🏄 Play Again!</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const gameOverDiv = document.getElementById('gameOver');
        const overlay = document.getElementById('overlay');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreElement = document.getElementById('finalScore');
        const finalHighScoreElement = document.getElementById('finalHighScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let velocity = {x: 0, y: 0};
        let food = {x: 15, y: 15};
        let score = 0;
        let highScore = localStorage.getItem('summerSnakeHighScore') || 0;
        let gameLoop = null;
        let gameRunning = false;
        let gameSpeed = 100;
        let waves = [];
        let sun = { pulse: 0 };
        let animationFrame = 0;

        // Initialize waves
        for (let i = 0; i < 5; i++) {
            waves.push({
                y: canvas.height * (0.7 + i * 0.06),
                offset: Math.random() * Math.PI * 2,
                speed: 0.02 + Math.random() * 0.02
            });
        }

        highScoreElement.textContent = highScore;

        function drawGame() {
            animationFrame++;

            // Ocean gradient background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#87CEEB');
            bgGradient.addColorStop(0.5, '#B0E0E6');
            bgGradient.addColorStop(0.7, '#F0E68C');
            bgGradient.addColorStop(1, '#DEB887');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw sun
            sun.pulse = Math.sin(animationFrame * 0.03) * 5;
            const sunGradient = ctx.createRadialGradient(
                canvas.width - 60, 60, 10,
                canvas.width - 60, 60, 40 + sun.pulse
            );
            sunGradient.addColorStop(0, '#FFFF00');
            sunGradient.addColorStop(0.4, '#FFA500');
            sunGradient.addColorStop(1, 'rgba(255, 165, 0, 0)');
            ctx.fillStyle = sunGradient;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#FFA500';
            ctx.beginPath();
            ctx.arc(canvas.width - 60, 60, 35 + sun.pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw waves
            waves.forEach((wave, index) => {
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 - index * 0.05})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let x = 0; x <= canvas.width; x += 5) {
                    const y = wave.y + Math.sin((x * 0.02) + (animationFrame * wave.speed) + wave.offset) * 8;
                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            });

            // Move snake
            if (velocity.x !== 0 || velocity.y !== 0) {
                const head = {
                    x: snake[0].x + velocity.x,
                    y: snake[0].y + velocity.y
                };

                // Check wall collision
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    endGame();
                    return;
                }

                // Check self collision
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        endGame();
                        return;
                    }
                }

                snake.unshift(head);

                // Check food collision
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreElement.textContent = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = highScore;
                        localStorage.setItem('summerSnakeHighScore', highScore);
                    }

                    placeFood();

                    // Increase speed slightly
                    if (score % 5 === 0 && gameSpeed > 50) {
                        gameSpeed -= 5;
                        clearInterval(gameLoop);
                        gameLoop = setInterval(drawGame, gameSpeed);
                    }
                } else {
                    snake.pop();
                }
            }

            // Draw tropical snake with summer colors
            const tropicalColors = [
                '#FF6347', // Tomato
                '#FFD700', // Gold
                '#20B2AA', // Light sea green
                '#FF69B4', // Hot pink
                '#FFA500', // Orange
                '#00CED1'  // Dark turquoise
            ];

            snake.forEach((segment, index) => {
                const color = tropicalColors[index % tropicalColors.length];
                const pulse = Math.sin(animationFrame * 0.1 + index * 0.5) * 2;

                // Glow effect
                ctx.shadowBlur = 20 + pulse;
                ctx.shadowColor = color;

                // Create summer gradient for segment
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    2,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2 + 2
                );
                gradient.addColorStop(0, 'white');
                gradient.addColorStop(0.4, color);
                gradient.addColorStop(1, color);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2 - 1,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // Add sparkle on head
                if (index === 0) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(
                        segment.x * gridSize + gridSize / 2 - 3,
                        segment.y * gridSize + gridSize / 2 - 3,
                        2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            });

            ctx.shadowBlur = 0;

            // Draw watermelon slice (food)
            const foodX = food.x * gridSize;
            const foodY = food.y * gridSize;
            const bounce = Math.sin(animationFrame * 0.1) * 3;

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.beginPath();
            ctx.ellipse(
                foodX + gridSize / 2,
                foodY + gridSize + 2,
                gridSize / 2,
                gridSize / 6,
                0, 0, Math.PI * 2
            );
            ctx.fill();

            // Watermelon
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#FF1493';

            // Red part
            const watermelonGradient = ctx.createRadialGradient(
                foodX + gridSize / 2, foodY + gridSize / 2 + bounce,
                2,
                foodX + gridSize / 2, foodY + gridSize / 2 + bounce,
                gridSize / 2
            );
            watermelonGradient.addColorStop(0, '#FF6B9D');
            watermelonGradient.addColorStop(1, '#C71585');
            ctx.fillStyle = watermelonGradient;
            ctx.beginPath();
            ctx.arc(foodX + gridSize / 2, foodY + gridSize / 2 + bounce, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Green rind
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.arc(foodX + gridSize / 2, foodY + gridSize / 2 + bounce, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.stroke();

            // Seeds
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000000';
            for (let i = 0; i < 3; i++) {
                const angle = (i * Math.PI * 2 / 3) + animationFrame * 0.02;
                const seedX = foodX + gridSize / 2 + Math.cos(angle) * 4;
                const seedY = foodY + gridSize / 2 + bounce + Math.sin(angle) * 4;
                ctx.fillRect(seedX - 1, seedY - 1.5, 2, 3);
            }

            // Sparkles around food
            for (let i = 0; i < 4; i++) {
                const angle = (animationFrame * 0.1 + i * Math.PI / 2);
                const sparkleX = foodX + gridSize / 2 + Math.cos(angle) * (gridSize / 2 + 5);
                const sparkleY = foodY + gridSize / 2 + Math.sin(angle) * (gridSize / 2 + 5) + bounce;

                ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.beginPath();
                ctx.arc(sparkleX, sparkleY, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
        }

        function placeFood() {
            let newFood;
            let validPosition = false;

            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }
            }

            food = newFood;
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            velocity = {x: 1, y: 0};
            score = 0;
            gameSpeed = 100;
            scoreElement.textContent = score;
            placeFood();
            gameRunning = true;
            startBtn.innerHTML = '🔄 Restart Game!';

            if (gameLoop) {
                clearInterval(gameLoop);
            }
            gameLoop = setInterval(drawGame, gameSpeed);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            finalHighScoreElement.textContent = highScore;
            overlay.classList.add('show');
            gameOverDiv.classList.add('show');
        }

        function closeGameOver() {
            overlay.classList.remove('show');
            gameOverDiv.classList.remove('show');
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);

        restartBtn.addEventListener('click', () => {
            closeGameOver();
            startGame();
        });

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            switch(e.key) {
                case 'ArrowUp':
                    if (velocity.y === 0) {
                        velocity = {x: 0, y: -1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) {
                        velocity = {x: 0, y: 1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) {
                        velocity = {x: -1, y: 0};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) {
                        velocity = {x: 1, y: 0};
                    }
                    e.preventDefault();
                    break;
            }
        });

        // Initial draw
        drawGame();
    </script>
</body>
</html>
